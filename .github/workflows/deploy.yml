name: Deploy System Restaurant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy system restaurant on AWS EC2 server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |

            cd system-restaurant-backend
            git pull origin main

            npm install
            npx prisma generate
            npm run build

            pm2 restart system-restaurant || pm2 start dist/main.js --name system-restaurant
